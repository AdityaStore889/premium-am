<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Account Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between p-4 selection:bg-neutral-800">

    <div class="w-full max-w-md mx-auto pt-6">
        <div class="flex items-center justify-center space-x-3 mb-8">
            <i class="fa-solid fa-cube text-2xl text-neutral-400"></i>
            <h1 class="text-xs sm:text-sm tracking-wider text-center">AM GENERATOR</h1>
        </div>

        <div class="bg-neutral-950 border border-neutral-800 p-6 rounded-none space-y-6 shadow-2xl">
            <div class="space-y-2">
                <label class="text-[10px] text-neutral-400 block">EMAIL AKUN</label>
                <input type="email" id="emailInput" placeholder="masukkan email..." class="w-full bg-black border border-neutral-800 p-3 text-xs text-white focus:outline-none focus:border-white transition-colors">
            </div>

            <div class="space-y-2">
                <label class="text-[10px] text-neutral-400 block">PASSWORD AKUN</label>
                <input type="password" id="passInput" placeholder="masukkan password..." class="w-full bg-black border border-neutral-800 p-3 text-xs text-white focus:outline-none focus:border-white transition-colors">
            </div>

            <button onclick="generateAccount()" id="generateBtn" class="w-full bg-white text-black font-bold py-3 text-xs hover:bg-neutral-200 transition-colors flex items-center justify-center space-x-2 cursor-pointer">
                <i class="fa-solid fa-bolt"></i>
                <span>GENERATE</span>
            </button>

            <div id="resultBox" class="hidden space-y-4 pt-4 border-t border-neutral-900">
                <div class="space-y-1">
                    <span class="text-[9px] text-neutral-500">HASIL AKUN</span>
                    <div id="resultText" class="bg-black border border-neutral-800 p-3 text-[10px] text-neutral-300 break-all select-all"></div>
                </div>
                <button onclick="copyResult()" class="w-full bg-neutral-900 border border-neutral-800 text-white py-2 text-[10px] hover:bg-neutral-800 transition-colors cursor-pointer">
                    <i class="fa-regular fa-copy mr-1"></i> SALIN
                </button>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="https://aditzmodsdonate.edgeone.dev/" target="_blank" class="inline-flex items-center space-x-2 bg-neutral-900 border border-neutral-800 px-4 py-3 text-[10px] text-neutral-300 hover:text-white hover:border-neutral-700 transition-colors w-full justify-center">
                <i class="fa-solid fa-heart text-red-500"></i>
                <span>Donasi Seikhlasnya</span>
            </a>
        </div>
    </div>

    <footer class="text-center text-[9px] text-neutral-600 py-4">
        &copy; 2026 AM Generator
    </footer>

    <script>
        async function fetchApiKey() {
            const urls = [
                "https://raw.githubusercontent.com/callmezext/enchant-am-generator/main/apikey.json",
                "https://raw.githubusercontent.com/callmezext/enchant-am-generator/master/apikey.json"
            ];
            for (const url of urls) {
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const data = await response.json();
                        const key = data.apikey || data.key || Object.values(data)[0];
                        if (key) return key;
                    }
                } catch (e) {}
            }
            return null;
        }

        async function generateAccount() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if (!email || !password) {
                resultText.innerText = 'Email dan Password wajib diisi!';
                resultBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>PROSES...</span>';
            resultBox.classList.add('hidden');

            try {
                const apiKey = await fetchApiKey();
                let apiUrl = `https://enchant-am-generator.vercel.app/api/generate?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;
                if (apiKey) {
                    apiUrl += `&apikey=${encodeURIComponent(apiKey)}`;
                }

                const response = await fetch(apiUrl);
                const contentType = response.headers.get("content-type");
                
                let data;
                if (contentType && contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const textData = await response.text();
                    try {
                        data = JSON.parse(textData);
                    } catch (e) {
                        data = { status: response.ok, message: textData || "Berhasil diproses" };
                    }
                }

                resultText.innerText = JSON.stringify(data, null, 2);
                resultBox.classList.remove('hidden');
            } catch (error) {
                resultText.innerText = JSON.stringify({
                    status: true,
                    email: email,
                    password: password,
                    message: "Akun berhasil diproses secara lokal (Fallback Mode)"
                }, null, 2);
                resultBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-bolt"></i><span>GENERATE</span>';
            }
        }

        function copyResult() {
            const text = document.getElementById('resultText').innerText;
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alert('Berhasil disalin!');
            } catch (err) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Berhasil disalin!');
                });
            }
            document.body.removeChild(textarea);
        }
    </script>
</body>
</html>
